<!doctype html>
<html lang="pt-BR" data-theme="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>ZeroX</title>
    <script>
      try {
        var t = localStorage.getItem('zerox:boot-theme')
        if (/^(mono|dolphin|blackwidow|frog|wolf)$/.test(t)) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
